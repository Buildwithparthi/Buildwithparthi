
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#542078"/>
      <stop offset="100%" stop-color="#542078"/>
    </linearGradient>

    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E653B9"/>
      <stop offset="100%" stop-color="#542078"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none"
            stroke="#E653B9" stroke-opacity=".12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <!-- Animated waves -->
  <path d="M0 260 Q300 160 600 260 T1200 230"
        fill="none" stroke="#E653B9"
        stroke-width="2" opacity=".5">
    <animate attributeName="d"
      values="M0 260 Q300 160 600 260 T1200 230;
              M0 230 Q300 310 600 210 T1200 260;
              M0 260 Q300 160 600 260 T1200 230"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <path d="M0 300 Q300 220 600 300 T1200 270"
        fill="none" stroke="#E653B9"
        stroke-width="2" opacity=".3">
    <animate attributeName="d"
      values="M0 300 Q300 220 600 300 T1200 270;
              M0 270 Q300 340 600 250 T1200 300;
              M0 300 Q300 220 600 300 T1200 270"
      dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Floating particles -->
  <g fill="#E653B9" filter="url(#glow)">
    <circle cx="100" cy="70" r="3">
      <animate attributeName="cy" values="70;110;70"
               dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="100" r="4">
      <animate attributeName="cy" values="100;65;100"
               dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="290" r="3">
      <animate attributeName="cy" values="290;250;290"
               dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="290" r="4">
      <animate attributeName="cy" values="290;250;290"
               dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="55" r="3">
      <animate attributeName="opacity" values=".2;1;.2"
               dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Moving orbital rings -->
  <g transform="translate(1010 175)" fill="none"
     stroke="#E653B9" filter="url(#glow)">
    <ellipse rx="100" ry="42" stroke-width="2" opacity=".8">
      <animateTransform attributeName="transform"
        type="rotate" from="0" to="360"
        dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="100" ry="42" stroke-width="1" opacity=".5"
             transform="rotate(60)">
      <animateTransform attributeName="transform"
        type="rotate" from="60" to="420"
        dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="8" fill="#E653B9">
      <animate attributeName="r" values="6;11;6"
               dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Decorative code symbols -->
  <g font-family="monospace" fill="#E653B9"
     font-size="26" opacity=".8">
    <text x="80" y="180">&lt;/&gt;
      <animate attributeName="opacity"
        values=".3;1;.3" dur="3s"
        repeatCount="indefinite"/>
    </text>
    <text x="1080" y="65">{ }
      <animate attributeName="opacity"
        values="1;.3;1" dur="4s"
        repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Main title -->
  <text x="600" y="125"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="bold"
        letter-spacing="3"
        fill="#FFFFFF"
        filter="url(#glow)">
    BUILD WITH PARTHI
    <animate attributeName="opacity"
      values=".75;1;.75" dur="3s"
      repeatCount="indefinite"/>
  </text>

  <!-- Animated underline -->
  <rect x="380" y="145" width="440" height="3"
        rx="2" fill="url(#pink)">
    <animate attributeName="width"
      values="100;440;100"
      dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="600" y="195"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        fill="#FFFFFF">
    Turning Ideas Into Practical Solutions
  </text>

  <!-- Role -->
  <text x="600" y="235"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        letter-spacing="3"
        fill="#E653B9">
    CLOUD TECHNOLOGY  •  CYBERSECURITY
  </text>

  <!-- Bottom text -->
  <text x="600" y="310"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="16"
        letter-spacing="4"
        fill="#FFFFFF">
    LEARN  •  BUILD  •  INNOVATE  •  GROW
    <animate attributeName="opacity"
      values=".4;1;.4" dur="3s"
      repeatCount="indefinite"/>
  </text>

</svg>
